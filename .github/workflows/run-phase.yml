name: VIBE — Run Phase (headless engine)

# The keystone: prove a VIBE phase prompt runs the engine head­lessly in GitHub
# Actions — generating a real deliverable and committing it back, so the web
# surface (which reads the committed artifacts + gates.json) stays in sync with
# no VS Code in the loop.
#
# Trigger: Actions tab → "VIBE — Run Phase" → Run workflow.
# Requires repo secret COPILOT_GITHUB_TOKEN (a Copilot-enabled token).

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: VIBE prompt id (without the .prompt.md suffix)
        type: string
        default: vibe-personas
      engagement:
        description: Engagement kebab name (folder under engagement/)
        type: string
        default: cloudtest
      seed_demo:
        description: Seed demo/contoso sources first (for a self-contained proof)
        type: boolean
        default: true
      model:
        description: Engine model id (blank = Copilot CLI default, Claude Sonnet 4.5)
        type: string
        default: ''

permissions:
  contents: write

jobs:
  run-phase:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ENGAGEMENT: ${{ inputs.engagement }}
      PROMPT: ${{ inputs.prompt }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Seed demo sources (optional, for a self-contained run)
        if: ${{ inputs.seed_demo }}
        run: |
          set -euo pipefail
          ENG="engagement/${ENGAGEMENT}"
          mkdir -p "$ENG" sources sources/research
          # Transcripts + questionnaires + research give the engine real signal to read.
          cp demo/contoso/transcript-*.md sources/ 2>/dev/null || true
          cp demo/contoso/customer-brief.md "$ENG/" 2>/dev/null || true
          cp demo/contoso/questionnaire-customer-pre.md sources/questionnaire-responses.md 2>/dev/null || true
          cp demo/contoso/research/research-summary.md sources/research/ 2>/dev/null || true
          echo "Seeded sources for engagement '${ENGAGEMENT}':"
          ls -R sources "$ENG" || true

      - name: Resolve prompt → headless invocation
        run: node scripts/resolve-prompt.mjs "$PROMPT" "engagement=${ENGAGEMENT}"

      - name: Record baseline commit (so engine self-commits are detectable)
        run: echo "BEFORE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Run the engine (copilot -p, headless)
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${COPILOT_GITHUB_TOKEN:-}" ]; then
            echo "::error::COPILOT_GITHUB_TOKEN secret is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          AGENT="$(cat .vibe/agent.txt)"
          MODEL="${{ inputs.model }}"
          MODEL_ARG=""
          if [ -n "$MODEL" ]; then MODEL_ARG="--model $MODEL"; fi
          echo "Running prompt '$PROMPT' as agent '$AGENT' (model: ${MODEL:-default}) for engagement '$ENGAGEMENT'…"
          # --allow-all = tools + paths + urls (lets the agent create the target dir
          # and write the deliverable); --no-ask-user + -s keep it non-interactive.
          timeout 900 copilot \
            -p "$(cat .vibe/invocation.md)" \
            --agent "$AGENT" \
            $MODEL_ARG \
            --allow-all \
            --no-ask-user \
            --no-color \
            --log-level info \
            -s 2>&1 | tee .vibe/run.log

      - name: Verify a deliverable was produced
        id: verify
        run: |
          set -euo pipefail
          ENG="engagement/${ENGAGEMENT}"
          # Most deliverables land in $ENG; some Preparation prompts (research,
          # schedule) write into sources/ instead. On a grounded run (seed_demo=false)
          # nothing is pre-seeded, so any sources/ change is genuine engine output and
          # we widen the check to include it. On a demo run we only trust $ENG, so the
          # seeded inputs under sources/ aren't mistaken for output.
          if [ "${{ inputs.seed_demo }}" = "true" ]; then
            SCOPE="$ENG"
          else
            SCOPE="$ENG sources"
          fi
          # A deliverable counts if the engine left an uncommitted .md change in
          # scope OR committed directly during the run (HEAD moved past the
          # baseline recorded before launch). The agent runs with --allow-all, so
          # it sometimes commits its own output; without the HEAD-moved check that
          # work is invisible here and the job discards a perfectly good run.
          UNCOMMITTED="$(git status --porcelain $SCOPE | grep -E '\.md$' || true)"
          if [ -z "$UNCOMMITTED" ] && [ "$(git rev-parse HEAD)" = "$BEFORE_SHA" ]; then
            echo "::error::No deliverable was produced (checked: $SCOPE). See the run log artifact."
            exit 1
          fi
          echo "Engine output present (checked: $SCOPE):"
          git status --porcelain $SCOPE || true
          if [ "$(git rev-parse HEAD)" != "$BEFORE_SHA" ]; then
            echo "Engine committed directly ($BEFORE_SHA → $(git rev-parse HEAD)):"
            git log --oneline "$BEFORE_SHA..HEAD" || true
          fi

      - name: Compute committed gates ledger
        run: node scripts/gen-gates.mjs "engagement/${ENGAGEMENT}"

      - name: Commit deliverable + gates back to the repo
        run: |
          set -euo pipefail
          ENG="engagement/${ENGAGEMENT}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ENG"
          # Preparation research/schedule prompts write into sources/. Stage those too,
          # but only on a grounded run — on a demo run sources/ holds seeded inputs we
          # never want to commit back. (Discover/Disrupt engine runs don't write under
          # sources/, so this is a harmless no-op for them.)
          if [ "${{ inputs.seed_demo }}" != "true" ]; then
            git add sources
          fi
          if git diff --cached --quiet; then
            echo "No uncommitted changes to stage (engine may have committed directly)."
          else
            git commit \
              -m "VIBE engine: ${PROMPT} → ${ENG} (headless Actions run)" \
              -m "Generated by .github/workflows/run-phase.yml (run ${GITHUB_RUN_ID})." \
              -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          fi
          # Nothing changed → nothing to push.
          if [ "$(git rev-parse HEAD)" = "$BEFORE_SHA" ]; then
            echo "Nothing to push (engine produced no commit)."
            exit 0
          fi
          # The push races with other writers on the same branch: parallel phase runs
          # and the web surface (sign-offs + "Refresh gates" commits) all push here.
          # A plain push fails non-fast-forward the moment another commit lands during
          # the multi-minute engine run, which kills an otherwise-successful run. So
          # rebase onto the latest remote and retry. gates.json is the one file every
          # writer rewrites, so a conflict there is resolved by regenerating the ledger
          # rather than merging it by hand.
          BRANCH="${GITHUB_REF_NAME}"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${BRANCH}"; then
              echo "Pushed engine output to ${BRANCH} (attempt ${attempt})."
              exit 0
            fi
            echo "Push attempt ${attempt} rejected (branch moved); rebasing onto origin/${BRANCH}…"
            git fetch origin "${BRANCH}"
            if ! git rebase "origin/${BRANCH}"; then
              UNMERGED="$(git diff --name-only --diff-filter=U || true)"
              if [ "$UNMERGED" = "$ENG/gates.json" ]; then
                echo "Resolving gates.json ledger conflict by regenerating it…"
                node scripts/gen-gates.mjs "$ENG"
                git add "$ENG/gates.json"
                GIT_EDITOR=true git rebase --continue
              else
                echo "::error::Rebase conflict on ${BRANCH} (files: ${UNMERGED:-unknown}). Manual resolution needed."
                git rebase --abort || true
                exit 1
              fi
            fi
          done
          echo "::error::Could not push to ${BRANCH} after 5 attempts — persistent contention on the branch."
          exit 1

      - name: Upload run log + deliverable (proof)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vibe-run-${{ inputs.prompt }}-${{ inputs.engagement }}
          path: |
            .vibe/run.log
            .vibe/invocation.md
            engagement/${{ inputs.engagement }}/**
          if-no-files-found: warn
