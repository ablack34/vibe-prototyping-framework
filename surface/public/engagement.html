<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VIBE — Engagement</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <a class="logo" href="/">◆</a>
      <div>
        <div class="brand-title" id="eng-name">Engagement</div>
        <div class="brand-sub" id="eng-sub">Loading…</div>
      </div>
    </div>
    <div class="topbar-right">
      <div class="engine-pick" id="engine-pick" hidden></div>
      <a class="back" href="/">← All engagements</a>
    </div>
  </header>

  <div id="phasebar" class="phase-timeline"></div>

  <main class="dash">
    <div id="genbanner" class="genbanner" hidden></div>
    <section id="sources" class="sources-panel"></section>
    <section id="data" hidden></section>
    <section id="preparation" hidden></section>
    <section id="context" class="context-band" hidden></section>
    <section id="gates"></section>
    <section id="disrupt" hidden></section>
  </main>

  <!-- slide-over artifact viewer -->
  <div id="viewer" class="viewer" hidden>
    <div class="viewer-scrim" data-close></div>
    <aside class="viewer-panel">
      <div class="viewer-head">
        <div class="viewer-head-main">
          <button class="viewer-back" id="viewer-back" type="button" hidden>← Back</button>
          <div class="viewer-title" id="viewer-title">Artifact</div>
          <div class="viewer-meta" id="viewer-meta"></div>
        </div>
        <button class="viewer-close" data-close>✕</button>
      </div>
      <div class="viewer-body markdown" id="viewer-body"></div>
    </aside>
  </div>

  <script src="/auth.js"></script>
  <script src="/markdown.js"></script>
  <script src="/engagement.js"></script>
</body>
</html>
